<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller with Good UX</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/diceroller/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/diceroller/favicon-android.png" />
  <link rel="apple-touch-icon" href="/diceroller/favicon-ios.png" />
  <style>
    :root {
      --bg-color: #0f766e;
      --card-bg: #ffffff;
      --text-main: #1e1e2f;
      --text-muted: #8e8e9f;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --border: #e2e2ea;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      padding: 1rem;
      /* We do our own scroll compensation in JS, so turn off the
         browser's scroll anchoring to avoid double-correcting. */
      overflow-anchor: none;
    }

    .container {
      /* auto margins = "center if there's room, otherwise start at top
         and let the page scroll normally". This is what fixes the
         clipped-top problem when the display area grows past 100vh. */
      margin: auto;
      background: var(--card-bg);
      padding: 3rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    /* ---------- Control bar ---------- */
    .control-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    /* ---------- Segmented switch ---------- */
    .switch {
      position: relative;
      display: inline-flex;
      padding: 4px;
      background: var(--switch-track, #eef0f6);
      border-radius: 999px;
      user-select: none;
      -webkit-user-select: none;
    }

    .switch-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
      transition: none;
      pointer-events: none;
    }

    .switch-thumb.is-ready {
      transition:
        transform 0.32s cubic-bezier(0.34, 1.3, 0.64, 1),
        width 0.32s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .switch-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0.55rem 1.35rem;
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .switch-btn:hover {
      color: var(--text-main);
    }

    .switch-btn[aria-pressed="true"],
    .switch-btn[aria-pressed="true"]:hover {
      color: #ffffff;
    }

    .switch-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ---------- Clear button ---------- */
    .ghost-btn {
      border: 1px solid var(--border);
      background: transparent;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: calc(0.55rem - 1px) 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background-color 0.2s ease,
        transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .ghost-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.06);
    }

    .ghost-btn:active {
      transform: scale(0.96);
    }

    .ghost-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .ghost-btn[hidden] {
      display: none;
    }

    /* ---------- Display ---------- */
    .display-area {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.05em;
      padding: 0.75rem 0;
      margin-bottom: 2rem;
    }

    .display-line {
      display: block;
      width: 100%;
      max-width: 100%;
      text-align: center;
      line-height: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* ---------- Dice grid ---------- */
    .dice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .die-button {
      background: none;
      border: 2px solid var(--border);
      border-radius: 0.75rem;
      width: 80px;
      height: 80px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .die-button:hover, .die-button:focus {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.15);
      outline: none;
    }

    .die-button svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .die-button text {
      font-size: 26px;
      font-weight: bold;
      font-family: system-ui, sans-serif;
      fill: currentColor;
      stroke: none;
      user-select: none;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: pop 0.3s ease-out forwards;
    }

    .rolling {
      color: var(--accent) !important;
    }

    #calc {
      display: inline;
    }

    #rolling {
      display: inline-block;
      margin-left: 0.03em;
    }

    #eq {
      font-size: 4rem;
    }

    #calc, #rolling, #result {
      font-size: 6rem;
    }

    #calc, #rolling, #result, #eq {
      font-weight: 800;
      line-height: 1;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-thumb.is-ready { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="display-area">
      <div class="display-line">
        <div id="calc"></div>
        <div id="rolling"></div>
      </div>
      <div id="eq"></div>
      <div id="result"></div>
    </div>

    <div class="control-area">
      <div class="switch" role="group" aria-label="Roll mode">
        <span class="switch-thumb" aria-hidden="true"></span>
        <button id="button-single" class="switch-btn" type="button" aria-pressed="true">Single</button>
        <button id="button-multi" class="switch-btn" type="button" aria-pressed="false">Multi</button>
      </div>
      <button id="button-clear" class="ghost-btn" type="button">Clear</button>
    </div>

    <div class="dice-grid">
      <button class="die-button" data-sides="4" aria-label="Roll d4">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 15,80 85,80" />
          <text x="50%" y="64%" dominant-baseline="middle" text-anchor="middle">d4</text>
        </svg>
      </button>
      <button class="die-button" data-sides="6" aria-label="Roll d6">
        <svg viewBox="0 0 100 100">
          <rect x="20" y="20" width="60" height="60" rx="8" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">d6</text>
        </svg>
      </button>
      <button class="die-button" data-sides="8" aria-label="Roll d8">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,50 50,85 15,50" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">d8</text>
        </svg>
      </button>
      <button class="die-button" data-sides="10" aria-label="Roll d10">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,40 50,85 15,40" />
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">d10</text>
        </svg>
      </button>
      <button class="die-button" data-sides="12" aria-label="Roll d12">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,38 72,85 28,85 15,38" />
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle">d12</text>
        </svg>
      </button>
      <button class="die-button" data-sides="20" aria-label="Roll d20">
        <svg viewBox="0 0 100 100">
          <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">d20</text>
        </svg>
      </button>
      <button class="die-button" data-sides="100" aria-label="Roll d100">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="35" />
          <text x="50%" y="54%" font-size="20px" dominant-baseline="middle" text-anchor="middle">d100</text>
        </svg>
      </button>
    </div>
  </div>

  <script>
    if (navigator.language.startsWith("ru")) {
      document.title = "Удобные кости";
    }

    const calcDisplay = document.getElementById('calc');
    const rollingDisplay = document.getElementById('rolling');
    const eqDisplay = document.getElementById('eq');
    const resultDisplay = document.getElementById('result');
    const buttonSingle = document.getElementById('button-single');
    const buttonMulti = document.getElementById('button-multi');
    const buttonClear = document.getElementById('button-clear');
    const diceButtons = document.querySelectorAll('.die-button');
    const switchEl = document.querySelector('.switch');
    const thumbEl = document.querySelector('.switch-thumb');
    const containerEl = document.querySelector('.container');
    const diceGridEl = document.querySelector('.dice-grid');

    let rollInterval = null;
    let isSingle = true;
    buttonClear.hidden = true;

    /* ---------------------------------------------------------
       Scroll anchoring.
    --------------------------------------------------------- */
    function docTop(el) {
      return el.getBoundingClientRect().top + window.scrollY;
    }

    let lastGridTop = docTop(diceGridEl);

    const ro = new ResizeObserver(() => {
      const newTop = docTop(diceGridEl);
      const delta = newTop - lastGridTop;
      if (delta !== 0) {
        window.scrollBy(0, delta);
      }
      lastGridTop = docTop(diceGridEl);
    });
    ro.observe(containerEl);

    /* ---------------------------------------------------------
       Sliding thumb
    --------------------------------------------------------- */
    function positionThumb() {
      const active = isSingle ? buttonSingle : buttonMulti;
      const sRect = switchEl.getBoundingClientRect();
      const bRect = active.getBoundingClientRect();
      if (!bRect.width) return;

      const cs = getComputedStyle(switchEl);
      const x = bRect.left - sRect.left - (parseFloat(cs.borderLeftWidth) || 0);
      const y = bRect.top - sRect.top - (parseFloat(cs.borderTopWidth) || 0);

      thumbEl.style.width = bRect.width + 'px';
      thumbEl.style.height = bRect.height + 'px';
      thumbEl.style.transform = `translate(${x}px, ${y}px)`;
    }

    positionThumb();
    requestAnimationFrame(() => thumbEl.classList.add('is-ready'));
    window.addEventListener('resize', positionThumb);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(positionThumb);
    }

    /* --------------------------------------------------------- */

    function resetDisplays() {
      if (rollInterval) {
        clearInterval(rollInterval);
        rollInterval = null;
      }
      calcDisplay.innerText = "";
      rollingDisplay.innerText = "";
      eqDisplay.innerText = "";
      resultDisplay.innerText = "";
      rollingDisplay.classList.remove('animate-pop', 'rolling');
      resultDisplay.classList.remove('animate-pop', 'rolling');
    }

    function setMode(single) {
      isSingle = single;
      buttonSingle.setAttribute('aria-pressed', String(single));
      buttonMulti.setAttribute('aria-pressed', String(!single));
      buttonClear.hidden = single;
      resetDisplays();
      positionThumb();
    }

    function rollDie(sides) {
      if (rollInterval) clearInterval(rollInterval);

      if (isSingle) {
        calcDisplay.innerText = "";
      } else if (rollingDisplay.innerText !== "") {
        calcDisplay.innerText = calcDisplay.innerText + rollingDisplay.innerText + "+";
        rollingDisplay.innerText = "";
      }

      rollingDisplay.classList.remove('animate-pop');
      resultDisplay.classList.remove('animate-pop');
      rollingDisplay.classList.add('rolling');
      resultDisplay.classList.add('rolling');

      let ticks = 0;
      const maxTicks = 12;
      const tickDuration = 35;

      rollInterval = setInterval(() => {
        rollingDisplay.innerText = Math.floor(Math.random() * sides) + 1;
        ticks++;

        if (ticks >= maxTicks) {
          clearInterval(rollInterval);
          rollInterval = null;

          const finalResult = Math.floor(Math.random() * sides) + 1;
          rollingDisplay.classList.remove('rolling');
          resultDisplay.classList.remove('rolling');
          rollingDisplay.innerText = finalResult;
          void resultDisplay.offsetWidth;
          rollingDisplay.classList.add('animate-pop');

          if (calcDisplay.innerText !== "") {
            eqDisplay.innerText = "=";
            resultDisplay.innerText = eval(calcDisplay.innerText + rollingDisplay.innerText);
            resultDisplay.classList.add('animate-pop');
          }
        }
      }, tickDuration);
    }

    diceButtons.forEach(button => {
      button.addEventListener('click', () => {
        const sides = parseInt(button.dataset.sides, 10);
        rollDie(sides);
      });
    });

    buttonSingle.addEventListener('click', () => {
      if (!isSingle) setMode(true);
    });

    buttonMulti.addEventListener('click', () => {
      if (isSingle) setMode(false);
    });

    buttonClear.addEventListener('click', resetDisplays);
  </script>
</body>
</html>
