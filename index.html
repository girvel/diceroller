<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dice Roller with Good UX</title>
  <link rel="icon" type="image/png" sizes="16x16" href="/diceroller/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/diceroller/favicon-android.png" />
  <link rel="apple-touch-icon" href="/diceroller/favicon-ios.png" />
  <style>
    :root {
      --bg-color: #1a1208;
      --card-bg: #efe0b8;
      --text-main: #2a1a08;
      --text-muted: #6b4a1a;
      --gold-light: #f5d670;
      --gold-mid: #c9a227;
      --gold-dark: #8b6914;
      --bronze: #8b6a30;
      --bronze-dark: #3a2a14;
      --bronze-shadow: #2a1a08;
      --wax-red: #8b1010;
      --wax-red-hi: #c03030;
      --wax-red-dark: #4a0808;
      --accent: #b8860b;
      --border: #8b6a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-color);
      scrollbar-color: var(--gold-mid) var(--bronze-shadow);
      scrollbar-width: thin;
    }

    body {
      font-family: Georgia, "Palatino Linotype", "Book Antiqua", Palatino, "Times New Roman", serif;
      color: var(--text-main);
      display: flex;
      box-sizing: content-box;
      min-height: calc(100vh - 2rem);
      padding: 1rem;
      overflow-anchor: none;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(201, 162, 39, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 15% 85%, rgba(139, 16, 16, 0.10) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 75%, rgba(139, 16, 16, 0.08) 0%, transparent 55%);
      background-attachment: fixed;
    }

    .container {
      margin: auto;
      background-color: var(--card-bg);
      background-image:
        radial-gradient(ellipse at 25% 0%, rgba(255, 250, 220, 0.9) 0%, transparent 55%),
        radial-gradient(ellipse at 90% 100%, rgba(139, 90, 30, 0.18) 0%, transparent 55%),
        radial-gradient(circle, rgba(120, 80, 30, 0.05) 1px, transparent 1px);
      background-size: auto, auto, 3px 3px;
      padding: 2.75rem 2rem;
      width: 100%;
      max-width: 600px;
      text-align: center;
      border: 1px solid var(--bronze);
      outline: 2px solid var(--bronze-shadow);
      outline-offset: 4px;
      border-radius: 3px;
      box-shadow:
        inset 0 0 40px rgba(139, 90, 30, 0.22),
        inset 0 0 0 1px rgba(255, 240, 200, 0.4),
        0 14px 40px rgba(0, 0, 0, 0.65),
        0 0 60px rgba(201, 162, 39, 0.08);
    }

    .control-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .switch {
      position: relative;
      display: inline-flex;
      padding: 3px;
      background: linear-gradient(180deg, var(--bronze-dark) 0%, #5a3f1e 100%);
      border: 1px solid var(--bronze-shadow);
      border-radius: 4px;
      user-select: none;
      -webkit-user-select: none;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.55),
        inset 0 -1px 0 rgba(255, 220, 150, 0.15),
        0 2px 0 rgba(0, 0, 0, 0.4);
    }

    .switch-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 50%, var(--gold-dark) 100%);
      border: 1px solid var(--bronze-dark);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25),
        0 1px 3px rgba(0, 0, 0, 0.45),
        0 0 12px rgba(201, 162, 39, 0.45);
      transition: none;
      pointer-events: none;
    }

    .switch-thumb.is-ready {
      transition:
        transform 0.32s cubic-bezier(0.34, 1.3, 0.64, 1),
        width 0.32s cubic-bezier(0.34, 1.3, 0.64, 1),
        height 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
    }

    .switch-btn {
      position: relative;
      z-index: 1;
      border: none;
      background: transparent;
      font: inherit;
      font-family: Georgia, "Palatino Linotype", serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #d4b878;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      padding: 0.55rem 1.35rem;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .switch-btn:hover {
      color: var(--gold-light);
    }

    .switch-btn[aria-pressed="true"],
    .switch-btn[aria-pressed="true"]:hover {
      color: #2a1a08;
      text-shadow: 0 1px 0 rgba(255, 220, 150, 0.6);
    }

    .switch-btn:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }

    .ghost-btn {
      border: 1px solid var(--wax-red-dark);
      background: linear-gradient(180deg, var(--wax-red-hi) 0%, var(--wax-red) 55%, #6a0808 100%);
      font: inherit;
      font-family: Georgia, "Palatino Linotype", serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f0d090;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
      padding: 0.55rem 1.15rem;
      border-radius: 3px;
      cursor: pointer;
      transition:
        color 0.2s ease,
        background 0.2s ease,
        transform 0.1s ease,
        box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      box-shadow:
        inset 0 1px 0 rgba(255, 200, 150, 0.35),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 2px 0 #3a0505,
        0 3px 8px rgba(0, 0, 0, 0.5);
    }

    .ghost-btn:hover {
      color: #fff8dd;
      background: linear-gradient(180deg, #d04040 0%, var(--wax-red-hi) 55%, var(--wax-red) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 200, 150, 0.5),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 2px 0 #3a0505,
        0 3px 12px rgba(192, 48, 48, 0.55);
    }

    .ghost-btn:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.5),
        0 0 0 #3a0505;
    }

    .ghost-btn:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }

    .ghost-btn[hidden] {
      display: none;
    }

    .ghost-btn--gold {
      border-color: var(--gold-dark);
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 55%, var(--gold-dark) 100%);
      color: #2a1a08;
      text-shadow: 0 1px 0 rgba(255, 240, 200, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.55),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25),
        0 2px 0 #4a3510,
        0 3px 8px rgba(0, 0, 0, 0.5);
    }

    .ghost-btn--gold:hover {
      color: #000;
      background: linear-gradient(180deg, #fff0a0 0%, var(--gold-light) 55%, var(--gold-mid) 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25),
        0 2px 0 #4a3510,
        0 3px 12px rgba(201, 162, 39, 0.6);
    }

    .ghost-btn--gold:active {
      transform: translateY(1px);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.35),
        0 0 0 #4a3510;
    }

    .display-area {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.05em;
      padding: 0.75rem 0.5rem;
      margin-bottom: 2rem;
      background:
        linear-gradient(180deg,
          rgba(74, 42, 15, 0.10) 0%,
          rgba(74, 42, 15, 0.02) 25%,
          rgba(74, 42, 15, 0.02) 75%,
          rgba(74, 42, 15, 0.10) 100%);
      border: 1px solid rgba(107, 74, 26, 0.35);
      border-radius: 3px;
      box-shadow:
        inset 0 2px 6px rgba(74, 42, 15, 0.18),
        inset 0 -1px 0 rgba(255, 250, 220, 0.6);
    }

    .display-line {
      display: block;
      width: 100%;
      max-width: 100%;
      text-align: center;
      line-height: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      font-style: italic;
      color: rgba(74, 42, 15, 0.5);
      letter-spacing: 0.06em;
      min-height: 1.1em;
      font-variant-numeric: tabular-nums;
    }

    .dice-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .die-button {
      background: linear-gradient(180deg, #f7ecc8 0%, #e8d5a0 48%, #d4b878 100%);
      border: 2px solid #6b4a1a;
      border-radius: 5px;
      width: 80px;
      height: 80px;
      cursor: pointer;
      color: #4a2f0f;
      transition: color 0.15s ease, transform 0.12s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        inset 1px 1px 0 rgba(255, 255, 255, 0.65),
        inset -1px -1px 0 rgba(107, 74, 26, 0.35),
        0 3px 0 #4a2f0f,
        0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .die-button:hover, .die-button:focus {
      border-color: var(--gold-mid);
      color: #8b0000;
      background: linear-gradient(180deg, #fff8dd 0%, #f5e5b0 48%, #e0c586 100%);
      transform: translateY(-2px);
      box-shadow:
        inset 1px 1px 0 rgba(255, 255, 255, 0.8),
        inset -1px -1px 0 rgba(107, 74, 26, 0.35),
        0 5px 0 #4a2f0f,
        0 8px 18px rgba(201, 162, 39, 0.55),
        0 0 0 1px rgba(201, 162, 39, 0.4);
      outline: none;
    }

    .die-button:active {
      transform: translateY(2px);
      box-shadow:
        inset 1px 1px 3px rgba(74, 42, 15, 0.4),
        inset -1px -1px 0 rgba(255, 255, 255, 0.3),
        0 1px 0 #4a2f0f,
        0 2px 4px rgba(0, 0, 0, 0.35);
    }

    .die-button svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .die-button text {
      font-size: 26px;
      font-weight: 700;
      font-family: Georgia, "Palatino Linotype", serif;
      fill: currentColor;
      stroke: none;
      user-select: none;
      letter-spacing: -0.02em;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .animate-pop {
      animation: pop 0.3s ease-out forwards;
    }

    .rolling {
      color: var(--accent) !important;
      text-shadow:
        0 0 12px rgba(201, 162, 39, 0.65),
        0 0 24px rgba(201, 162, 39, 0.35),
        0 1px 0 rgba(255, 250, 220, 0.7) !important;
    }

    #calc {
      display: inline;
    }

    #rolling {
      display: inline-block;
      margin-left: 0.03em;
    }

    #eq {
      font-size: 4rem;
    }

    #calc, #rolling, #result {
      font-size: 6rem;
    }

    #calc, #rolling, #result, #eq {
      font-weight: 700;
      font-family: Georgia, "Palatino Linotype", serif;
      line-height: 1;
      color: #3a1a08;
      text-shadow:
        0 1px 0 rgba(255, 250, 220, 0.7),
        0 -1px 0 rgba(74, 42, 15, 0.25);
      font-variant-numeric: tabular-nums;
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .history-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 300px;
      max-width: 85vw;
      padding: 1.5rem 1.25rem;
      background-color: #2a1a08;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(201, 162, 39, 0.18) 0%, transparent 55%),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0 2px, transparent 2px 4px);
      border-left: 3px solid var(--bronze);
      box-shadow:
        -8px 0 24px rgba(0, 0, 0, 0.6),
        inset 1px 0 0 rgba(255, 220, 150, 0.15);
      transform: translateX(100%);
      transition: transform 0.32s cubic-bezier(0.34, 1.1, 0.64, 1);
      z-index: 100;
      overflow-y: auto;
      color: var(--gold-light);
    }

    .history-sidebar.open {
      transform: translateX(0);
    }

    .history-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(201, 162, 39, 0.35);
    }

    .history-title span {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-mid);
      text-shadow: 0 0 12px rgba(201, 162, 39, 0.45);
    }

    .history-close {
      background: none;
      border: none;
      color: var(--gold-mid);
      font: inherit;
      font-size: 1.5rem;
      line-height: 1;
      letter-spacing: 0;
      padding: 0 0.25rem;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .history-close:hover {
      opacity: 1;
      color: var(--gold-light);
    }

    .history-close:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
      border-radius: 3px;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-entry {
      padding: 0.55rem 0.8rem;
      font-size: 0.9rem;
      font-family: Georgia, "Palatino Linotype", serif;
      letter-spacing: 0.03em;
      color: #d4b878;
      background: rgba(0, 0, 0, 0.25);
      border-left: 2px solid rgba(201, 162, 39, 0.4);
      border-radius: 2px;
      cursor: help;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      overflow-wrap: anywhere;
    }

    .history-entry:hover {
      background: rgba(201, 162, 39, 0.14);
      color: var(--gold-light);
      border-left-color: var(--gold-light);
    }

    .history-empty {
      padding: 1.25rem 0.5rem;
      text-align: center;
      font-size: 0.85rem;
      font-style: italic;
      color: rgba(212, 184, 120, 0.5);
    }

    ::-webkit-scrollbar {
      width: 12px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bronze-shadow);
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--gold-mid) 0%, var(--gold-dark) 100%);
      border: 1px solid var(--bronze-shadow);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 100%);
    }

    @media (prefers-reduced-motion: reduce) {
      .switch-thumb.is-ready { transition: none; }
      .history-sidebar { transition: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="display-area">
      <div class="display-line">
        <div id="calc"></div><div id="rolling"></div>
      </div>
      <div id="eq"></div>
      <div id="result"></div>
      <div id="status"></div>
    </div>

    <div class="control-area">
      <div class="switch" role="group" aria-label="Roll mode">
        <span class="switch-thumb" aria-hidden="true"></span>
        <button id="button-single" class="switch-btn" type="button" aria-pressed="true">Single</button>
        <button id="button-multi" class="switch-btn" type="button" aria-pressed="false">Multi</button>
      </div>
      <div class="btn-group">
        <button id="button-history" class="ghost-btn ghost-btn--gold" type="button" aria-expanded="false" aria-controls="history-sidebar">History</button>
        <button id="button-clear" class="ghost-btn" type="button">Clear</button>
      </div>
    </div>

    <div class="dice-grid">
      <button class="die-button" data-sides="4" aria-label="Roll d4">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 15,80 85,80" />
          <text x="50%" y="64%" dominant-baseline="middle" text-anchor="middle">4</text>
        </svg>
      </button>
      <button class="die-button" data-sides="6" aria-label="Roll d6">
        <svg viewBox="0 0 100 100">
          <rect x="20" y="20" width="60" height="60" rx="8" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">6</text>
        </svg>
      </button>
      <button class="die-button" data-sides="8" aria-label="Roll d8">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,50 50,85 15,50" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">8</text>
        </svg>
      </button>
      <button class="die-button" data-sides="10" aria-label="Roll d10">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,40 50,85 15,40" />
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">10</text>
        </svg>
      </button>
      <button class="die-button" data-sides="12" aria-label="Roll d12">
        <svg viewBox="0 0 100 100">
          <polygon points="50,15 85,38 72,85 28,85 15,38" />
          <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle">12</text>
        </svg>
      </button>
      <button class="die-button" data-sides="20" aria-label="Roll d20">
        <svg viewBox="0 0 100 100">
          <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" />
          <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle">20</text>
        </svg>
      </button>
      <button class="die-button" data-sides="100" aria-label="Roll d100">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="35" />
          <text x="50%" y="54%" font-size="20px" dominant-baseline="middle" text-anchor="middle">100</text>
        </svg>
      </button>
    </div>
  </div>

  <aside id="history-sidebar" class="history-sidebar" aria-hidden="true">
    <div class="history-title">
      <span id="history-title-text">History</span>
      <button type="button" class="history-close" aria-label="Close history">×</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </aside>

  <script>
    const RU = navigator.language.startsWith("ru");

    const STR = RU
      ? {
          title: "Удобные кости",
          single: "Один",
          multi: "Много",
          clear: "Очистить",
          history: "История",
          historyClose: "Закрыть историю",
          historyEmpty: "Пока пусто",
          rollPrefix: "Бросить к",
          diePrefix: "к"
        }
      : {
          title: "Dice Roller with Good UX",
          single: "Single",
          multi: "Multi",
          clear: "Clear",
          history: "History",
          historyClose: "Close history",
          historyEmpty: "No entries yet",
          rollPrefix: "Roll d",
          diePrefix: "d"
        };

    document.title = STR.title;

    const calcDisplay = document.getElementById('calc');
    const rollingDisplay = document.getElementById('rolling');
    const eqDisplay = document.getElementById('eq');
    const resultDisplay = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const buttonSingle = document.getElementById('button-single');
    const buttonMulti = document.getElementById('button-multi');
    const buttonClear = document.getElementById('button-clear');
    const buttonHistory = document.getElementById('button-history');
    const diceButtons = document.querySelectorAll('.die-button');
    const switchEl = document.querySelector('.switch');
    const thumbEl = document.querySelector('.switch-thumb');
    const containerEl = document.querySelector('.container');
    const diceGridEl = document.querySelector('.dice-grid');
    const bodyEl = document.body;
    const sidebarEl = document.getElementById('history-sidebar');
    const historyListEl = document.getElementById('history-list');
    const historyTitleEl = document.getElementById('history-title-text');
    const historyCloseEl = sidebarEl.querySelector('.history-close');

    buttonSingle.textContent = STR.single;
    buttonMulti.textContent = STR.multi;
    buttonClear.textContent = STR.clear;
    buttonHistory.textContent = STR.history;
    historyTitleEl.textContent = STR.history;
    historyCloseEl.setAttribute('aria-label', STR.historyClose);

    diceButtons.forEach(btn => {
      const sides = btn.dataset.sides;
      btn.setAttribute('aria-label', STR.rollPrefix + sides);
    });

    const HISTORY_MAX = 30;

    let rollInterval = null;
    let isSingle = true;
    buttonClear.hidden = true;

    let sessionCounter = 0;
    let currentSessionId = null;
    let currentSessionRolls = [];
    let historyEntries = [];
    let pendingRoll = null;

    function formatDiceComposition(rolls) {
      const order = [];
      const counts = new Map();
      for (const r of rolls) {
        if (!counts.has(r.sides)) order.push(r.sides);
        counts.set(r.sides, (counts.get(r.sides) || 0) + 1);
      }
      return order.map(s => `${counts.get(s)}${STR.diePrefix}${s}`).join(' + ');
    }

    function updateStatus() {
      statusEl.textContent = currentSessionRolls.length
        ? formatDiceComposition(currentSessionRolls)
        : '';
    }

    function renderHistory() {
      historyListEl.innerHTML = '';
      if (historyEntries.length === 0) {
        const li = document.createElement('li');
        li.className = 'history-empty';
        li.textContent = STR.historyEmpty;
        historyListEl.appendChild(li);
        return;
      }
      for (let i = historyEntries.length - 1; i >= 0; i--) {
        const entry = historyEntries[i];
        const li = document.createElement('li');
        li.className = 'history-entry';
        const diceStr = formatDiceComposition(entry.rolls);
        const total = entry.rolls.reduce((a, r) => a + r.value, 0);
        li.textContent = `${diceStr} = ${total}`;
        const exact = entry.rolls.map(r => r.value).join(' + ');
        li.title = entry.rolls.length === 1 ? String(total) : `${exact} = ${total}`;
        historyListEl.appendChild(li);
      }
    }

    function recordHistory() {
      if (currentSessionRolls.length === 0 || currentSessionId === null) return;
      const entry = {
        id: currentSessionId,
        rolls: currentSessionRolls.map(r => ({ sides: r.sides, value: r.value }))
      };
      const idx = historyEntries.findIndex(e => e.id === currentSessionId);
      if (idx >= 0) historyEntries[idx] = entry;
      else historyEntries.push(entry);

      const overflow = historyEntries.length - HISTORY_MAX;
      if (overflow > 0) historyEntries.splice(0, overflow);

      renderHistory();
    }

    function startFreshSession() {
      currentSessionId = null;
      currentSessionRolls = [];
      updateStatus();
    }

    renderHistory();

    function setSidebar(open) {
      sidebarEl.classList.toggle('open', open);
      sidebarEl.setAttribute('aria-hidden', String(!open));
      buttonHistory.setAttribute('aria-expanded', String(open));
    }

    buttonHistory.addEventListener('click', (e) => {
      e.stopPropagation();
      setSidebar(!sidebarEl.classList.contains('open'));
    });

    historyCloseEl.addEventListener('click', () => setSidebar(false));

    document.addEventListener('click', (e) => {
      if (!sidebarEl.classList.contains('open')) return;
      if (sidebarEl.contains(e.target) || buttonHistory.contains(e.target)) return;
      setSidebar(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && sidebarEl.classList.contains('open')) setSidebar(false);
    });

    function docTop(el) {
      return el.getBoundingClientRect().top + window.scrollY;
    }

    function getBodyPaddingBottom() {
      return parseFloat(getComputedStyle(bodyEl).paddingBottom) || 0;
    }
    function setBodyPaddingBottom(px) {
      bodyEl.style.paddingBottom = Math.max(0, px) + 'px';
    }

    let lastGridDocTop = docTop(diceGridEl);

    const ro = new ResizeObserver(() => {
      const newDocTop = docTop(diceGridEl);
      const delta = newDocTop - lastGridDocTop;
      if (delta === 0) return;

      const sBefore = window.scrollY;
      window.scrollBy(0, delta);
      const applied = window.scrollY - sBefore;
      const remaining = delta - applied;

      if (remaining > 0) {
        setBodyPaddingBottom(getBodyPaddingBottom() + remaining);
        void bodyEl.offsetHeight;
        window.scrollBy(0, remaining);
      } else if (remaining < 0) {
        const curPB = getBodyPaddingBottom();
        const basePB = 16;
        const reduceBy = Math.min(-remaining, Math.max(0, curPB - basePB));
        if (reduceBy > 0) setBodyPaddingBottom(curPB - reduceBy);
      }

      lastGridDocTop = docTop(diceGridEl);
    });
    ro.observe(containerEl);

    function positionThumb() {
      const active = isSingle ? buttonSingle : buttonMulti;
      const sRect = switchEl.getBoundingClientRect();
      const bRect = active.getBoundingClientRect();
      if (!bRect.width) return;

      const cs = getComputedStyle(switchEl);
      const x = bRect.left - sRect.left - (parseFloat(cs.borderLeftWidth) || 0);
      const y = bRect.top - sRect.top - (parseFloat(cs.borderTopWidth) || 0);

      thumbEl.style.width = bRect.width + 'px';
      thumbEl.style.height = bRect.height + 'px';
      thumbEl.style.transform = `translate(${x}px, ${y}px)`;
    }

    positionThumb();
    requestAnimationFrame(() => thumbEl.classList.add('is-ready'));
    window.addEventListener('resize', positionThumb);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(positionThumb);
    }

    function commitRoll(sides, value) {
      if (isSingle) {
        currentSessionId = ++sessionCounter;
        currentSessionRolls = [{ sides, value }];
      } else {
        if (currentSessionId === null) currentSessionId = ++sessionCounter;
        currentSessionRolls.push({ sides, value });
      }
      updateStatus();
      recordHistory();
    }

    function resetDisplays() {
      if (rollInterval) {
        clearInterval(rollInterval);
        rollInterval = null;
      }
      pendingRoll = null;
      calcDisplay.innerText = "";
      rollingDisplay.innerText = "";
      eqDisplay.innerText = "";
      resultDisplay.innerText = "";
      rollingDisplay.classList.remove('animate-pop', 'rolling');
      resultDisplay.classList.remove('animate-pop', 'rolling');

      startFreshSession();

      setBodyPaddingBottom(16);
      window.scrollTo(0, 0);
      requestAnimationFrame(() => {
        lastGridDocTop = docTop(diceGridEl);
      });
    }

    function setMode(single) {
      isSingle = single;
      buttonSingle.setAttribute('aria-pressed', String(single));
      buttonMulti.setAttribute('aria-pressed', String(!single));
      buttonClear.hidden = single;
      resetDisplays();
      positionThumb();
    }

    function rollDie(sides) {
      if (rollInterval) {
        clearInterval(rollInterval);
        rollInterval = null;
        if (pendingRoll) {
          commitRoll(pendingRoll.sides, pendingRoll.value);
          pendingRoll = null;
        }
      }

      if (isSingle) {
        calcDisplay.innerText = "";
      } else if (rollingDisplay.innerText !== "") {
        calcDisplay.innerText = calcDisplay.innerText + rollingDisplay.innerText + "+";
        rollingDisplay.innerText = "";
      }

      rollingDisplay.classList.remove('animate-pop');
      resultDisplay.classList.remove('animate-pop');
      rollingDisplay.classList.add('rolling');
      resultDisplay.classList.add('rolling');

      const initial = Math.floor(Math.random() * sides) + 1;
      rollingDisplay.innerText = initial;
      pendingRoll = { sides, value: initial };

      let ticks = 0;
      const maxTicks = 12;
      const tickDuration = 35;

      rollInterval = setInterval(() => {
        const v = Math.floor(Math.random() * sides) + 1;
        rollingDisplay.innerText = v;
        if (pendingRoll) pendingRoll.value = v;
        ticks++;

        if (ticks >= maxTicks) {
          clearInterval(rollInterval);
          rollInterval = null;

          const finalResult = Math.floor(Math.random() * sides) + 1;
          rollingDisplay.classList.remove('rolling');
          resultDisplay.classList.remove('rolling');
          rollingDisplay.innerText = finalResult;
          void resultDisplay.offsetWidth;
          rollingDisplay.classList.add('animate-pop');

          pendingRoll = null;
          commitRoll(sides, finalResult);

          if (calcDisplay.innerText !== "") {
            eqDisplay.innerText = "=";
            resultDisplay.innerText = eval(calcDisplay.innerText + rollingDisplay.innerText);
            resultDisplay.classList.add('animate-pop');
          }
        }
      }, tickDuration);
    }

    diceButtons.forEach(button => {
      button.addEventListener('click', () => {
        const sides = parseInt(button.dataset.sides, 10);
        rollDie(sides);
      });
    });

    buttonSingle.addEventListener('click', () => {
      if (!isSingle) setMode(true);
    });

    buttonMulti.addEventListener('click', () => {
      if (isSingle) setMode(false);
    });

    buttonClear.addEventListener('click', resetDisplays);
  </script>
</body>
</html>
